services:
  abdbadmin:
    build: .
    ports:
      - "${ABDB_BIND:-127.0.0.1}:${ABDB_PORT:-8099}:8099"
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      ABDB_PORT: "${ABDB_PORT:-8099}"
      ABDB_IP: "${ABDB_IP:-}"
      ABDB_DOMAIN: "${ABDB_DOMAIN:-}"
    volumes:
      - claydb-data:/app/data
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  claydb-data:
