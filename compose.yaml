services:
  abdbadmin:
    build: .
    ports:
      - "${ABDB_BIND:-127.0.0.1}:${ABDB_PORT:-8099}:8099"
    environment:
      ABDB_LOCAL_ONLY: "${ABDB_LOCAL_ONLY:-0}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      ABDB_ADVANCED_ENABLED: "${ABDB_ADVANCED_ENABLED:-0}"
      ABDB_ADVANCED_PORT: "${ABDB_ADVANCED_PORT:-8100}"
      ABDB_PORT: "${ABDB_PORT:-8099}"
      ABDB_SSH_HOST_KEYS: "${ABDB_SSH_HOST_KEYS:-}"
      ABDB_DB_SOURCE_IP: "${ABDB_DB_SOURCE_IP:-}"
      ABDB_IP: "${ABDB_IP:-}"
      ABDB_DOMAIN: "${ABDB_DOMAIN:-}"
    volumes:
      - claydb-data:/app/data
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  phpmyadmin:
    image: phpmyadmin:apache
    profiles: [advanced]
    ports:
      - "127.0.0.1:${ABDB_ADVANCED_PORT:-8100}:80"
    environment:
      PMA_ARBITRARY: "1"
      UPLOAD_LIMIT: "${ABDB_ADVANCED_UPLOAD_LIMIT:-64M}"
    security_opt: [no-new-privileges:true]
volumes:
  claydb-data:
